services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gap_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: gap_engine
    ports:
      - "5432:5432"
    volumes:
      - gap_engine_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gap_engine -d gap_engine"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4400
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PERSISTENCE_DRIVER: postgres
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?Set DOCUMENT_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4400,http://127.0.0.1:4400}
      UPLOAD_DIRECTORY: /app/uploads
    ports:
      - "4400:4400"
    volumes:
      - gap_engine_uploads:/app/uploads
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4400/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gap_engine_postgres:
  gap_engine_uploads:
